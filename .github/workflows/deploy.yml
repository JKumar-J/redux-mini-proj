name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build site
        env:
          VITE_UNSPLASH_KEY: ${{ secrets.VITE_UNSPLASH_KEY || vars.VITE_UNSPLASH_KEY }}
          VITE_PEXELS_KEY: ${{ secrets.VITE_PEXELS_KEY || vars.VITE_PEXELS_KEY || secrets.VITE_PEXLES_KEY || vars.VITE_PEXLES_KEY }}
          VITE_GIPHY_KEY: ${{ secrets.VITE_GIPHY_KEY || vars.VITE_GIPHY_KEY }}
        shell: bash
        run: |
          if [[ -z "$VITE_UNSPLASH_KEY" ]]; then
            echo "::error::Missing GitHub Actions secret or variable: VITE_UNSPLASH_KEY"
            exit 1
          fi
          if [[ -z "$VITE_PEXELS_KEY" ]]; then
            echo "::error::Missing GitHub Actions secret or variable: VITE_PEXELS_KEY"
            exit 1
          fi
          if [[ -z "$VITE_GIPHY_KEY" ]]; then
            echo "::error::Missing GitHub Actions secret or variable: VITE_GIPHY_KEY"
            exit 1
          fi
          npm run build
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
